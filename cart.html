<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cart - MediCare Pharmacy</title>

    <link rel="stylesheet"
          href="node_modules/bootstrap/dist/css/bootstrap.css">

    <link rel="stylesheet"
          href="node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet"
          href="style.css">
          <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
<script src="script.js"></script>
<script src="cart.js"></script>

</head>

<body>


<nav class="navbar navbar-expand-lg navbar-dark pharmacy-navbar">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            <i class="bi bi-heart-pulse-fill"></i>
            MediCare Pharmacy

        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#nav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="nav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="medicines.html">
                        Medicines
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="categories.html">
                        Categories
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active"
                       href="cart.html">
                        Cart
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<section class="py-5">

    <div class="container">

        <h1 class="mb-4">
            Shopping Cart
        </h1>

        <div id="cartItems">

        </div>

    </div>

</section>


<footer class="footer py-4">

    <div class="container text-center">

        <h5>
            MediCare Pharmacy
        </h5>

        <p>
            Your trusted online pharmacy.
        </p>

        <hr>

        <p class="mb-0">
            © 2026 MediCare Pharmacy
        </p>

    </div>

</footer>


<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>

<script src="script.js"></script>

<script>

function displayCart() {

    let cart = getCart();

    let container =
        document.getElementById("cartItems");


    if (cart.length === 0) {

        container.innerHTML = `

            <div class="text-center py-5">

                <i class="bi bi-cart-x display-1 text-muted"></i>

                <h3 class="mt-3">
                    Your cart is empty
                </h3>

                <a href="medicines.html"
                   class="btn btn-success mt-3">

                    Shop Medicines

                </a>

            </div>

        `;

        return;
    }


    let total = 0;


    let html = `

        <div class="table-responsive">

            <table class="table align-middle">

                <thead>

                    <tr>

                        <th>Medicine</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody>

    `;


    cart.forEach(function(item) {

        let itemTotal =
            item.price * item.quantity;

        total += itemTotal;


        html += `

            <tr>

                <td>

                    <div class="d-flex align-items-center">

                        <img src="${item.image}"
                             width="70"
                             height="70"
                             class="rounded me-3"
                             style="object-fit:cover">

                        <strong>
                            ${item.name}
                        </strong>

                    </div>

                </td>

                <td>
                    ₹${item.price}
                </td>

                <td>

                    <button
                        class="btn btn-sm btn-outline-secondary"
                        onclick="changeQuantity(${item.id}, -1)">

                        -

                    </button>

                    <span class="mx-2">
                        ${item.quantity}
                    </span>

                    <button
                        class="btn btn-sm btn-outline-secondary"
                        onclick="changeQuantity(${item.id}, 1)">

                        +

                    </button>

                </td>

                <td>
                    ₹${itemTotal}
                </td>

                <td>

                    <button
                        class="btn btn-danger btn-sm"
                        onclick="removeFromCart(${item.id})">

                        <i class="bi bi-trash"></i>

                    </button>

                </td>

            </tr>

        `;

    });


    html += `

                </tbody>

            </table>

        </div>


        <div class="card p-4 mt-4">

            <div class="d-flex justify-content-between">

                <h4>
                    Total Amount
                </h4>

                <h4 class="text-success">
                    ₹${total}
                </h4>

            </div>


            <button
                class="btn btn-success btn-lg mt-3"
                onclick="placeOrder()">

                <i class="bi bi-bag-check"></i>

                Place Order

            </button>

        </div>

    `;


    container.innerHTML = html;

}


function changeQuantity(id, change) {

    let cart = getCart();


    let item =
        cart.find(function(item) {

            return item.id === id;

        });


    if (item) {

        item.quantity =
            item.quantity + change;


        if (item.quantity <= 0) {

            cart =
                cart.filter(function(item) {

                    return item.id !== id;

                });

        }

    }


    saveCart(cart);

    displayCart();

    updateCartCount();

}


function removeFromCart(id) {

    let cart = getCart();


    cart =
        cart.filter(function(item) {

            return item.id !== id;

        });


    saveCart(cart);

    displayCart();

    updateCartCount();

}


function placeOrder() {

    let cart = getCart();


    if (cart.length === 0) {

        alert("Your cart is empty.");

        return;

    }


    let orders =
        JSON.parse(
            localStorage.getItem("orders") || "[]"
        );


    let order = {

        id: Date.now(),

        items: cart,

        date: new Date().toLocaleString(),

        status: "Placed"

    };


    orders.push(order);


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    localStorage.removeItem("cart");


    alert("Order placed successfully!");


    window.location.href =
        "orders.html";

}


document.addEventListener(
    "DOMContentLoaded",
    function() {

        displayCart();

        updateCartCount();

    }
);

</script>

</body>
</html>
