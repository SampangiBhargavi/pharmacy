<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Orders - MediCare Pharmacy</title>

    <link rel="stylesheet"
          href="node_modules/bootstrap/dist/css/bootstrap.css">

    <link rel="stylesheet"
          href="node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet"
          href="style.css">


          <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
<script src="script.js"></script>
<script src="orders.js"></script>

</head>

<body>


<nav class="navbar navbar-expand-lg navbar-dark pharmacy-navbar">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            <i class="bi bi-heart-pulse-fill"></i>
            MediCare Pharmacy

        </a>

        <div>

            <a href="medicines.html"
               class="btn btn-success">

                Continue Shopping

            </a>

        </div>

    </div>

</nav>


<section class="py-5">

    <div class="container">

        <h1 class="mb-4">
            My Orders
        </h1>

        <div id="ordersList">

        </div>

    </div>

</section>


<script>

function displayOrders() {

    let orders =
        JSON.parse(
            localStorage.getItem("orders") || "[]"
        );


    let container =
        document.getElementById("ordersList");


    if (orders.length === 0) {

        container.innerHTML = `

            <div class="text-center py-5">

                <i class="bi bi-box-seam display-1 text-muted"></i>

                <h3 class="mt-3">
                    No orders yet
                </h3>

                <a href="medicines.html"
                   class="btn btn-success">

                    Shop Medicines

                </a>

            </div>

        `;

        return;

    }


    orders.reverse();


    orders.forEach(function(order) {

        let html = `

            <div class="card mb-4">

                <div class="card-header">

                    <strong>
                        Order #${order.id}
                    </strong>

                    <span class="badge bg-success float-end">
                        ${order.status}
                    </span>

                </div>


                <div class="card-body">

                    <p class="text-muted">
                        ${order.date}
                    </p>

        `;


        let total = 0;


        order.items.forEach(function(item) {

            let itemTotal =
                item.price * item.quantity;

            total += itemTotal;


            html += `

                <div class="d-flex justify-content-between border-bottom py-2">

                    <span>

                        ${item.name}

                        × ${item.quantity}

                    </span>

                    <strong>
                        ₹${itemTotal}
                    </strong>

                </div>

            `;

        });


        html += `

                    <div class="text-end mt-3">

                        <h5>
                            Total: ₹${total}
                        </h5>

                    </div>

                </div>

            </div>

        `;


        container.innerHTML += html;

    });

}


displayOrders();

</script>

</body>
</html>
