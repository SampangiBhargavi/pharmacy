<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Medicine Details - MediCare</title>

    <link rel="stylesheet"
          href="node_modules/bootstrap/dist/css/bootstrap.css">

    <link rel="stylesheet"
          href="node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark pharmacy-navbar">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            <i class="bi bi-heart-pulse-fill"></i>
            MediCare Pharmacy

        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#nav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="nav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="medicines.html">
                        Medicines
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="categories.html">
                        Categories
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="about.html">
                        About
                    </a>
                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="cart.html">

                        <i class="bi bi-cart3"></i>
                        Cart

                        <span class="badge bg-danger cart-count">
                            0
                        </span>

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<section class="py-5">

    <div class="container">

        <div id="medicineDetails">

        </div>

    </div>

</section>


<footer class="footer py-4">

    <div class="container text-center">

        <h5>MediCare Pharmacy</h5>

        <p>
            Your trusted online pharmacy.
        </p>

        <hr>

        <p class="mb-0">
            © 2026 MediCare Pharmacy
        </p>

    </div>

</footer>


<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>

<script src="script.js"></script>

<script src="medicines.js"></script>


<script>

let params =
    new URLSearchParams(window.location.search);

let id =
    Number(params.get("id"));


let medicine =
    medicines.find(function(item) {

        return item.id === id;

    });


let container =
    document.getElementById("medicineDetails");


if (medicine) {

    container.innerHTML = `

        <div class="row align-items-center">

            <div class="col-md-6 text-center">

                <img src="${medicine.image}"
                     class="img-fluid rounded"
                     style="max-height:400px"
                     alt="${medicine.name}">

            </div>


            <div class="col-md-6">

                <span class="badge bg-success mb-3">
                    ${medicine.category}
                </span>

                <h1>
                    ${medicine.name}
                </h1>

                <p class="text-muted">
                    ${medicine.description}
                </p>

                <h2 class="text-success">
                    ₹${medicine.price}
                </h2>

                <hr>

                <p>
                    <i class="bi bi-check-circle text-success"></i>
                    Quality healthcare product
                </p>

                <p>
                    <i class="bi bi-truck text-success"></i>
                    Fast delivery available
                </p>

                <p>
                    <i class="bi bi-shield-check text-success"></i>
                    Trusted pharmacy
                </p>

                <button
                    class="btn btn-success btn-lg"
                    onclick="addToCart(${medicine.id})">

                    <i class="bi bi-cart-plus"></i>

                    Add to Cart

                </button>

                <a href="medicines.html"
                   class="btn btn-outline-secondary btn-lg ms-2">

                    Back

                </a>

            </div>

        </div>

    `;

}
else {

    container.innerHTML = `

        <div class="text-center">

            <h2>
                Medicine not found
            </h2>

            <a href="medicines.html"
               class="btn btn-success">

                Back to Medicines

            </a>

        </div>

    `;

}


document.addEventListener(
    "DOMContentLoaded",
    function() {

        updateCartCount();

    }
);

</script>

</body>
</html>
